spring.application.name=shoppingCartAPI

# Configuration for database connection
spring.datasource.url=jdbc:mysql://localhost:3306/shoppingcartapi?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

# Configuration for JPA and Hibernate
server.error.include-message=always
server.error.include-binding-errors=always
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

# Configuration for logging

logging.level.co.com.store.shoppingCartAPI=debug